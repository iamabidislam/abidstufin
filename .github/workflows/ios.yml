name: Build iPhone app (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build STUFIN for offline use
        run: |
          bunx vite build
          bun scripts/ios-render-shell.mjs
          ls dist/client

      - name: Add iPhone wrapper
        run: |
          bun add -d @capacitor/cli@7 @capacitor/core@7 @capacitor/ios@7
          npx cap add ios
          npx cap sync ios

      - name: Set app icon
        run: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICON_DIR"/*.png; do sips -z 1024 1024 public/icon-512.png --out "$f"; done

      - name: Build app (no signing)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qr STUFIN-unsigned.ipa Payload
          ls -lh STUFIN-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: STUFIN-iPhone
          path: ios/App/build/STUFIN-unsigned.ipa
